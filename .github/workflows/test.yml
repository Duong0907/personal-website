name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next-env.d.ts and .next/types are gitignored. Generate them so tsc
      # knows the asset module types (*.svg, *.webp) and next/root-params.
      - run: pnpm exec next typegen

      - run: pnpm exec tsc --noEmit

      - run: pnpm test:coverage
